name: Update pinky-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2026.1118.5). Leave empty to use the latest stable GitHub release."
        required: false
        type: string
      force:
        description: "Force a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version downgrade"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "53 */12 * * *"

concurrency:
  group: aur-pinky-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            API_URL="https://api.github.com/repos/DIYgod/pinky/releases/tags/v${VERSION}"
          else
            API_URL='https://api.github.com/repos/DIYgod/pinky/releases/latest'
          fi

          release=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL") || fail "Could not read the release from GitHub"

          TAG=$(jq -er '.tag_name | strings | select(length > 1)' <<<"$release") ||
            fail "Release has no tag name"
          VERSION="${TAG#v}"
          [[ "$TAG" == "v${VERSION}" && "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] ||
            fail "Unsupported release tag: $TAG"
          jq -e '.draft == false and .prerelease == false' <<<"$release" >/dev/null ||
            fail "Release $TAG is a draft or a prerelease"

          # The release also carries dmg, zip, exe and apk builds. Exactly one
          # amd64 .deb may exist, and it has to be the one the PKGBUILD names;
          # a renamed or missing package must fail here instead of publishing a
          # source URL that no longer resolves.
          mapfile -t debs < <(
            jq -r '.assets[].name | select(test("_amd64\\.deb$"))' <<<"$release"
          )
          [ "${#debs[@]}" -eq 1 ] ||
            fail "Release $TAG carries ${#debs[@]} amd64 debs, expected exactly 1"

          DEB="pinky_${VERSION}_amd64.deb"
          [ "${debs[0]}" = "$DEB" ] || fail "Unexpected deb: ${debs[0]}"

          digest=$(jq -r --arg n "$DEB" '.assets[] | select(.name == $n) | .digest // ""' <<<"$release")
          [[ "$digest" == sha256:* ]] || fail "Release $TAG does not carry $DEB"

          work="$RUNNER_TEMP/pinky"
          rm -rf "$work"
          mkdir -p "$work"

          for name in SHA256SUMS "$DEB"; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 600 \
              "https://github.com/DIYgod/pinky/releases/download/v${VERSION}/${name}" \
              --output "$work/$name"
          done

          got=$(sha256sum "$work/$DEB" | cut -d' ' -f1)
          [ "$got" = "${digest#sha256:}" ] ||
            fail "Checksum mismatch for $DEB: got $got want ${digest#sha256:}"

          # The release's own checksum list is upstream's statement of what the
          # files are; the other entries are for builds this package does not
          # use, so only the present files are checked.
          ( cd "$work" && sha256sum --check --ignore-missing --status SHA256SUMS ) ||
            fail "$DEB does not match SHA256SUMS"

          deb_package=$(dpkg-deb --field "$work/$DEB" Package)
          deb_version=$(dpkg-deb --field "$work/$DEB" Version)
          deb_arch=$(dpkg-deb --field "$work/$DEB" Architecture)
          [ "$deb_package" = "pinky" ] ||
            fail "$DEB carries Package $deb_package, expected pinky"
          [ "$deb_version" = "$VERSION" ] ||
            fail "$DEB carries Version $deb_version, expected $VERSION"
          [ "$deb_arch" = "amd64" ] ||
            fail "$DEB carries Architecture $deb_arch, expected amd64"
          # Read the listing in full first: piping into `grep -q` would kill
          # dpkg-deb with SIGPIPE, which pipefail then reports as a failure.
          contents=$(dpkg-deb --contents "$work/$DEB")
          # Some deb builds list their paths as ./usr/... and others as usr/...,
          # so the check accepts either form.
          for path in opt/pinky/pinky usr/bin/pinkyctl \
                      usr/share/applications/pinky.desktop; do
            grep -qE "(^| )(\\./)?${path}( -> .*)?$" <<<"$contents" ||
              fail "$DEB does not install $path"
          done

          # Unpack the payload and run it: the program has to be an x86-64
          # executable and report the version the release claims to be. Pinky
          # needs no display for its version command.
          mkdir -p "$work/payload"
          dpkg-deb --fsys-tarfile "$work/$DEB" | tar -x -C "$work/payload"
          # LC_ALL=C keeps the header readable on any runner locale.
          header=$(LC_ALL=C readelf -h "$work/payload/opt/pinky/pinky")
          grep -q "Machine:.*X86-64" <<<"$header" ||
            fail "The packaged pinky is not an x86-64 executable"

          reported=$(PINKY_HOME="$work/home" "$work/payload/opt/pinky/pinky" version) ||
            fail "The packaged pinky does not run"
          [ "$reported" = "pinky ${VERSION}" ] ||
            fail "The packaged pinky reports '$reported', expected 'pinky ${VERSION}'"

          # The PKGBUILD takes the licence text from the same tag; without it
          # the AUR build cannot fetch its sources at all.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            "https://raw.githubusercontent.com/DIYgod/pinky/v${VERSION}/LICENSE" \
            --output "$work/LICENSE" ||
            fail "Cannot fetch LICENSE for $TAG"
          [ -s "$work/LICENSE" ] || fail "LICENSE for $TAG is empty"
          grep -q 'Apache License' "$work/LICENSE" ||
            fail "The LICENSE for $TAG is not the Apache licence text"

          echo "verified $DEB ($deb_version, $deb_arch)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare release with PKGBUILD
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' pinky-bin/PKGBUILD)
          [[ -n "$CURRENT_VERSION" ]] || { echo 'PKGBUILD has no pkgver' >&2; exit 1; }
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' pinky-bin/PKGBUILD)
          [[ -n "$CURRENT_REL" ]] || { echo 'PKGBUILD has no pkgrel' >&2; exit 1; }

          # Compare against what AUR actually serves: a run whose publication
          # failed after the GitHub copy moved on must be retried, not skipped
          # as "already up to date".
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=pinky-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [[ -n "$AUR_VERSION" && "$AUR_VERSION" != "$AHEAD_REF" ]] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          NEEDS_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == true ]]; then
              NEEDS_UPDATE=true
              BUMP_REL=true
            elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
              # Also the first publication, when AUR has no such package yet.
              NEEDS_UPDATE=true
              echo "Publishing the existing package state to AUR"
            fi
          else
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              [[ -n "$REQUESTED_VERSION" && "$ALLOW_DOWNGRADE" == true ]] || {
                echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
                exit 1
              }
            fi
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd pinky-bin

          # The download and licence URLs follow ${pkgver}, so the version line
          # is the only thing that has to change.
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            [[ "$CURRENT_REL" =~ ^[0-9]+$ ]] || { echo "Invalid pkgrel: $CURRENT_REL" >&2; exit 1; }
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

          grep -qxF "pkgver=$LATEST_VERSION" PKGBUILD || {
            echo "Failed to write pkgver=$LATEST_VERSION" >&2
            exit 1
          }

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: pinky-bin
          pkgbuild: ./pinky-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.release.outputs.version) || format('Update to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit successfully published version to GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pinky-bin/PKGBUILD
          # Publishing the state GitHub already has changes nothing here.
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for pinky-bin $LATEST_VERSION"
          else
            git commit -m "Update pinky-bin to version $LATEST_VERSION"
          fi
          git pull --rebase origin main
          git push
