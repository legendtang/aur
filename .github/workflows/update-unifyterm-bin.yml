name: Update unifyterm-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.2.3). Leave empty to use the latest stable GitHub release."
        required: false
        type: string
      force:
        description: "Force a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version downgrade"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 */12 * * *"

concurrency:
  group: aur-unifyterm-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || fail "Unsupported version: $VERSION"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/newdee/unifyterm/releases/tags/v${VERSION}" \
              --output release-raw.json ||
              fail "Could not read release v${VERSION}"
            jq -e '.draft == false' release-raw.json >/dev/null ||
              fail "Release v${VERSION} is a draft"
            jq '.' release-raw.json > release.json
          else
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/newdee/unifyterm/releases?per_page=30" \
              --output releases-raw.json ||
              fail "Could not read the release list from GitHub"
            jq -e 'type == "array" and ([.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+([.][0-9]+)+$")))] | length > 0)' \
              releases-raw.json >/dev/null ||
              fail "No stable release found"
            jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+([.][0-9]+)+$")))]
                | sort_by(.published_at) | reverse | .[0]' \
              releases-raw.json > release.json
          fi

          TAG=$(jq -er '.tag_name | select(type == "string" and length > 0)' release.json)
          DISCOVERED_VERSION=${TAG#v}
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] ||
            fail "Release tag $TAG does not match requested version $VERSION"
          VERSION=$DISCOVERED_VERSION
          [[ "$TAG" == "v${VERSION}" && "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] ||
            fail "Unsupported release tag: $TAG"
          jq -e '.draft == false and .prerelease == false' release.json >/dev/null ||
            fail "Release $TAG is a draft or a prerelease"

          # The release also carries an AppImage, a tarball, dmg, msi and zip
          # builds. Only the Debian package is packaged, and it is published
          # for x86_64 alone.
          DEB=$(jq -r '[.assets[] | select(.name | test("^unifyterm_[0-9].*_amd64\\.deb$"))]
                          | if length == 1 then .[0].name else "" end' release.json)
          [[ -n "$DEB" ]] || fail "Release $TAG has no single Debian package for amd64"
          jq -e --arg n "$DEB" '.assets | any(.name == $n and .state == "uploaded" and .size > 0)' \
            release.json >/dev/null || fail "Release $TAG has no usable $DEB"

          digest=$(jq -r --arg n "$DEB" '.assets[] | select(.name == $n) | .digest // ""' release.json)
          [[ "$digest" == sha256:* ]] || fail "Release $TAG does not carry a digest for $DEB"

          work="$RUNNER_TEMP/unifyterm"
          rm -rf "$work"
          mkdir -p "$work"

          for name in "$DEB" "$DEB.sha256"; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 1200 \
              "https://github.com/newdee/unifyterm/releases/download/${TAG}/${name}" \
              --output "$work/$name" ||
              fail "Could not download $name"
          done

          got=$(sha256sum "$work/$DEB" | cut -d' ' -f1)
          [ "$got" = "${digest#sha256:}" ] ||
            fail "Checksum mismatch for $DEB: got $got want ${digest#sha256:}"

          # Upstream publishes a checksum file next to the package.
          ( cd "$work" && sha256sum --check --ignore-missing --status "$DEB.sha256" ) ||
            fail "$DEB does not match $DEB.sha256"

          deb_package=$(dpkg-deb --field "$work/$DEB" Package)
          deb_version=$(dpkg-deb --field "$work/$DEB" Version)
          deb_arch=$(dpkg-deb --field "$work/$DEB" Architecture)
          [ "$deb_package" = "unifyterm" ] ||
            fail "$DEB carries Package $deb_package, expected unifyterm"
          [ "$deb_arch" = "amd64" ] ||
            fail "$DEB carries Architecture $deb_arch, expected amd64"

          # The Debian version is the release version with a Debian revision.
          deb_version=${deb_version#*:}
          deb_upstream=${deb_version%%-*}
          deb_rev=${deb_version##*-}
          [ "$deb_upstream" = "$VERSION" ] ||
            fail "$DEB carries version $deb_upstream, expected $VERSION"
          [[ "$deb_rev" =~ ^[0-9]+$ ]] ||
            fail "$DEB carries the Debian revision '$deb_rev', expected a number"
          [ "$DEB" = "unifyterm_${VERSION}-${deb_rev}_amd64.deb" ] ||
            fail "$DEB does not follow the naming of version $VERSION"

          # Read the listing in full first: piping into `grep -q` would kill
          # dpkg-deb with SIGPIPE, which pipefail then reports as a failure.
          contents=$(dpkg-deb --contents "$work/$DEB")
          for path in usr/bin/unifyterm usr/bin/ut \
                      usr/share/applications/unifyterm.desktop \
                      usr/share/icons/hicolor/256x256/apps/unifyterm.png \
                      usr/share/icons/hicolor/scalable/apps/unifyterm.svg \
                      usr/share/doc/unifyterm/copyright \
                      usr/share/doc/unifyterm/THIRD-PARTY-NOTICES; do
            grep -qE "(^| )(\\./)?${path}( -> .*)?$" <<<"$contents" ||
              fail "$DEB does not install $path"
          done

          mkdir -p "$work/payload"
          dpkg-deb --fsys-tarfile "$work/$DEB" | tar -x -C "$work/payload"

          # LC_ALL=C keeps the header readable on any runner locale.
          header=$(LC_ALL=C readelf -h "$work/payload/usr/bin/unifyterm")
          grep -q "Machine:.*X86-64" <<<"$header" ||
            fail "The packaged unifyterm is not an x86-64 executable"

          echo "verified $DEB ($deb_version, $deb_arch)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deb_rev=$deb_rev" >> "$GITHUB_OUTPUT"

      - name: Run the packaged program
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          work="$RUNNER_TEMP/unifyterm"

          # The program links against the X11 libraries, which the runner may
          # not carry; without them it cannot even print its version.
          libs=$(ldconfig -p)
          missing=0
          for lib in libxcb.so.1 libxkbcommon.so.0 libxkbcommon-x11.so.0; do
            grep -q "$lib" <<<"$libs" || missing=1
          done
          if [[ "$missing" == 1 ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              libxcb1 libxkbcommon0 libxkbcommon-x11-0
          fi

          version_output=$("$work/payload/usr/bin/unifyterm" --version)
          reported=${version_output%%$'\n'*}
          case "$reported" in
            "UnifyTerm ${VERSION}"*) ;;
            *) fail "The packaged unifyterm reports '$reported', expected version $VERSION" ;;
          esac

          # The commands come with the program as a second binary.
          ut_output=$("$work/payload/usr/bin/ut" --version)
          ut_reported=${ut_output%%$'\n'*}
          case "$ut_reported" in
            "ut ${VERSION}"*) ;;
            *) fail "The packaged ut reports '$ut_reported', expected version $VERSION" ;;
          esac

          echo "the packaged program reports version $VERSION"

      - name: Compare release with PKGBUILD
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' unifyterm-bin/PKGBUILD)
          [[ -n "$CURRENT_VERSION" ]] || { echo 'PKGBUILD has no pkgver' >&2; exit 1; }
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' unifyterm-bin/PKGBUILD)
          [[ -n "$CURRENT_REL" ]] || { echo 'PKGBUILD has no pkgrel' >&2; exit 1; }

          # Compare against what AUR actually serves: a run whose publication
          # failed after the GitHub copy moved on must be retried, not skipped
          # as "already up to date".
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=unifyterm-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [[ -n "$AUR_VERSION" && "$AUR_VERSION" != "$AHEAD_REF" ]] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | sed -n '1p')" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          NEEDS_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == true ]]; then
              NEEDS_UPDATE=true
              BUMP_REL=true
            elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
              # Also the first publication, when AUR has no such package yet.
              NEEDS_UPDATE=true
              echo "Publishing the existing package state to AUR"
            fi
          else
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | sed -n '1p')
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              [[ -n "$REQUESTED_VERSION" && "$ALLOW_DOWNGRADE" == true ]] || {
                echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
                exit 1
              }
            fi
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          DEB_REV: ${{ steps.release.outputs.deb_rev }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd unifyterm-bin

          # The tag, file name and source URL all follow ${pkgver}.
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            [[ "$CURRENT_REL" =~ ^[0-9]+$ ]] || { echo "Invalid pkgrel: $CURRENT_REL" >&2; exit 1; }
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

          # The Debian revision of the package can change with the release.
          sed -i "s/^_deb_rev=.*/_deb_rev=\"$DEB_REV\"/" PKGBUILD

          grep -qxF "pkgver=$LATEST_VERSION" PKGBUILD || {
            echo "Failed to write pkgver=$LATEST_VERSION" >&2
            exit 1
          }
          grep -qxF "_deb_rev=\"$DEB_REV\"" PKGBUILD || {
            echo "Failed to write _deb_rev=$DEB_REV" >&2
            exit 1
          }

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: unifyterm-bin
          pkgbuild: ./unifyterm-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.release.outputs.version) || format('Update to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit successfully published version to GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add unifyterm-bin/PKGBUILD
          # Publishing the state GitHub already has changes nothing here.
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for unifyterm-bin $LATEST_VERSION"
          else
            git commit -m "Update unifyterm-bin to version $LATEST_VERSION"
          fi
          git pull --rebase origin main
          git push
