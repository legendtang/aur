name: Update cherry-studio-desktop-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number. Leave empty to use the latest stable GitHub release."
        required: false
        type: string
      force:
        description: "Force a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version downgrade"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-cherry-studio-desktop-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            API_URL="https://api.github.com/repos/CherryHQ/cherry-studio/releases/tags/v${VERSION}"
          else
            API_URL='https://api.github.com/repos/CherryHQ/cherry-studio/releases/latest'
          fi

          RELEASE_JSON=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL")

          TAG=$(jq -er '.tag_name | strings | select(length > 1)' <<<"$RELEASE_JSON")
          VERSION="${TAG#v}"
          [[ "$TAG" == "v${VERSION}" && "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          }
          jq -e '.draft == false and .prerelease == false' <<<"$RELEASE_JSON" >/dev/null

          # The Debian assets are named after the build's own architecture
          # labels, which changed from amd64/arm64 to linux-x64/linux-arm64 in
          # 2.1.x. Match on what each file is for and let the PKGBUILD follow.
          for pair in 'x86_64:x64|amd64' 'aarch64:arm64'; do
            arch=${pair%%:*}
            pattern=${pair#*:}
            mapfile -t names < <(jq -r --arg v "$VERSION" '
              .assets[].name
              | select(startswith("Cherry-Studio-" + $v + "-") and endswith(".deb"))' \
              <<<"$RELEASE_JSON")
            matches=()
            for name in "${names[@]}"; do
              if [[ "$name" =~ -($pattern)\.deb$ ]]; then
                matches+=("$name")
              fi
            done
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Release $TAG has ${#matches[@]} ${arch} .deb assets, expected one" >&2
              printf '  %s\n' "${names[@]}" >&2
              exit 1
            fi
            name="${matches[0]}"
            # The part of the name that carries the architecture, e.g. linux-x64.
            tag="${name#Cherry-Studio-"${VERSION}"-}"
            echo "tag_${arch}=${tag%.deb}" >> "$GITHUB_OUTPUT"
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare release with PKGBUILD
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' cherry-studio-desktop-bin/PKGBUILD)
          [[ -n "$CURRENT_VERSION" ]] || { echo 'PKGBUILD has no pkgver' >&2; exit 1; }
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' cherry-studio-desktop-bin/PKGBUILD)
          [[ -n "$CURRENT_REL" ]] || { echo 'PKGBUILD has no pkgrel' >&2; exit 1; }

          # Compare against what AUR actually serves: a run whose publication
          # failed after the GitHub copy moved on must be retried, not skipped
          # as "already up to date".
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=cherry-studio-desktop-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [[ -n "$AUR_VERSION" && "$AUR_VERSION" != "$AHEAD_REF" ]] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          NEEDS_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == true ]]; then
              NEEDS_UPDATE=true
              BUMP_REL=true
            elif [[ -n "$AUR_VERSION" && "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
              NEEDS_UPDATE=true
              echo "Publishing the existing package state to AUR"
            fi
          else
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              [[ -n "$REQUESTED_VERSION" && "$ALLOW_DOWNGRADE" == true ]] || {
                echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
                exit 1
              }
            fi
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          X86_64_TAG: ${{ steps.release.outputs.tag_x86_64 }}
          AARCH64_TAG: ${{ steps.release.outputs.tag_aarch64 }}
        run: |
          set -euo pipefail
          cd cherry-studio-desktop-bin

          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            [[ "$CURRENT_REL" =~ ^[0-9]+$ ]] || { echo "Invalid pkgrel: $CURRENT_REL" >&2; exit 1; }
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

          # Keep the asset names in step with the release.
          update_deb() {
            local arch=$1 tag=$2
            [[ -n "$tag" ]] || { echo "No ${arch} asset name from the release step" >&2; exit 1; }
            sed -i "s|^_deb_${arch}=.*|_deb_${arch}=\"Cherry-Studio-\\\${pkgver}-${tag}.deb\"|" PKGBUILD
            grep -qxF "_deb_${arch}=\"Cherry-Studio-\${pkgver}-${tag}.deb\"" PKGBUILD ||
              { echo "Could not record the ${arch} asset name in the PKGBUILD" >&2; exit 1; }
          }
          update_deb x86_64 "$X86_64_TAG"
          update_deb aarch64 "$AARCH64_TAG"

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: cherry-studio-desktop-bin
          pkgbuild: ./cherry-studio-desktop-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.release.outputs.version) || format('Update to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit successfully published version to GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cherry-studio-desktop-bin/PKGBUILD
          # Publishing the state GitHub already has changes nothing here.
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for cherry-studio-desktop-bin $LATEST_VERSION"
          else
            git commit -m "Update cherry-studio-desktop-bin to version $LATEST_VERSION"
          fi
          git push
