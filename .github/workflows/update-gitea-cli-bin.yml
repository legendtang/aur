name: Update gitea-cli-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.0.0). Leave empty to use the latest stable Gitea release."
        required: false
        type: string
      force:
        description: "Force a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version downgrade"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 */12 * * *"

concurrency:
  group: aur-gitea-cli-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          # The project lives on Gitea, so the release API of Gitea is used.
          API="https://gitea.com/api/v1/repos/gitea/cli"

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || fail "Unsupported version: $VERSION"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$API/releases/tags/v${VERSION}" \
              --output release-raw.json ||
              fail "Could not read release v${VERSION}"
            jq -e '.draft == false' release-raw.json >/dev/null ||
              fail "Release v${VERSION} is a draft"
            jq '.' release-raw.json > release.json
          else
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$API/releases?limit=30" \
              --output releases-raw.json ||
              fail "Could not read the release list from Gitea"
            jq -e 'type == "array" and ([.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+([.][0-9]+)+$")))] | length > 0)' \
              releases-raw.json >/dev/null ||
              fail "No stable release found"
            jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^v[0-9]+([.][0-9]+)+$")))]
                | sort_by(.published_at) | reverse | .[0]' \
              releases-raw.json > release.json
          fi

          TAG=$(jq -er '.tag_name | select(type == "string" and length > 0)' release.json)
          DISCOVERED_VERSION=${TAG#v}
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] ||
            fail "Release tag $TAG does not match requested version $VERSION"
          VERSION=$DISCOVERED_VERSION
          [[ "$TAG" == "v${VERSION}" && "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] ||
            fail "Unsupported release tag: $TAG"
          jq -e '.draft == false and .prerelease == false' release.json >/dev/null ||
            fail "Release $TAG is a draft or a prerelease"

          # The release carries the packages for many systems; the ones for
          # Linux are the three debs, one for each architecture.
          DEBS=("gitea-cli_${VERSION}_amd64.deb"
                "gitea-cli_${VERSION}_arm64.deb"
                "gitea-cli_${VERSION}_armhf.deb")
          for name in "${DEBS[@]}" checksums.txt; do
            jq -e --arg n "$name" '.assets | any(.name == $n and .size > 0)' \
              release.json >/dev/null || fail "Release $TAG has no usable $name"
          done

          work="$RUNNER_TEMP/gitea"
          rm -rf "$work"
          mkdir -p "$work"

          for name in checksums.txt "${DEBS[@]}"; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 1200 \
              "https://gitea.com/gitea/cli/releases/download/${TAG}/${name}" \
              --output "$work/$name" ||
              fail "Could not download $name"
          done

          # Gitea does not publish a digest with every file, but the release
          # carries a checksum list that covers them all.
          ( cd "$work" && sha256sum --check --ignore-missing --status checksums.txt ) ||
            fail "The downloaded files do not match checksums.txt"

          for pair in "${DEBS[0]}:amd64:X86-64" "${DEBS[1]}:arm64:AArch64" "${DEBS[2]}:armhf:ARM"; do
            deb="${pair%%:*}"
            rest="${pair#*:}"
            deb_arch="${rest%%:*}"
            machine="${rest#*:}"

            deb_package=$(dpkg-deb --field "$work/$deb" Package)
            deb_version=$(dpkg-deb --field "$work/$deb" Version)
            deb_arch_field=$(dpkg-deb --field "$work/$deb" Architecture)
            [ "$deb_package" = "gitea-cli" ] ||
              fail "$deb carries Package $deb_package, expected gitea-cli"
            [ "$deb_version" = "$VERSION" ] ||
              fail "$deb carries Version $deb_version, expected $VERSION"
            [ "$deb_arch_field" = "$deb_arch" ] ||
              fail "$deb carries Architecture $deb_arch_field, expected $deb_arch"

            mkdir -p "$work/payload"
            dpkg-deb --fsys-tarfile "$work/$deb" | tar -x -C "$work/payload"
            # LC_ALL=C keeps the header readable on any runner locale.
            header=$(LC_ALL=C readelf -h "$work/payload/usr/bin/gt")
            grep -q "Machine:.*${machine}" <<<"$header" ||
              fail "The program in $deb is not a $machine executable"
            rm -rf "$work/payload"
          done

          # The program of the runner's own architecture has to run and to
          # report the version of the release.
          mkdir -p "$work/payload"
          dpkg-deb --fsys-tarfile "$work/${DEBS[0]}" | tar -x -C "$work/payload"
          reported=$("$work/payload/usr/bin/gt" --version | head -n1)
          case "$reported" in
            "gt version ${VERSION}"*) ;;
            *) fail "The packaged gt reports '$reported', expected version $VERSION" ;;
          esac

          echo "verified ${DEBS[*]} (version $VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare release with PKGBUILD
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' gitea-cli-bin/PKGBUILD)
          [[ -n "$CURRENT_VERSION" ]] || { echo 'PKGBUILD has no pkgver' >&2; exit 1; }
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' gitea-cli-bin/PKGBUILD)
          [[ -n "$CURRENT_REL" ]] || { echo 'PKGBUILD has no pkgrel' >&2; exit 1; }

          # Compare against what AUR actually serves: a run whose publication
          # failed after the GitHub copy moved on must be retried, not skipped
          # as "already up to date".
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=gitea-cli-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [[ -n "$AUR_VERSION" && "$AUR_VERSION" != "$AHEAD_REF" ]] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          NEEDS_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == true ]]; then
              NEEDS_UPDATE=true
              BUMP_REL=true
            elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
              # Also the first publication, when AUR has no such package yet.
              NEEDS_UPDATE=true
              echo "Publishing the existing package state to AUR"
            fi
          else
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              [[ -n "$REQUESTED_VERSION" && "$ALLOW_DOWNGRADE" == true ]] || {
                echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
                exit 1
              }
            fi
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd gitea-cli-bin

          # The tag, file names and source URLs all follow ${pkgver}.
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            [[ "$CURRENT_REL" =~ ^[0-9]+$ ]] || { echo "Invalid pkgrel: $CURRENT_REL" >&2; exit 1; }
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

          grep -qxF "pkgver=$LATEST_VERSION" PKGBUILD || {
            echo "Failed to write pkgver=$LATEST_VERSION" >&2
            exit 1
          }

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: gitea-cli-bin
          pkgbuild: ./gitea-cli-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.release.outputs.version) || format('Update to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit successfully published version to GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add gitea-cli-bin/PKGBUILD
          # Publishing the state GitHub already has changes nothing here.
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for gitea-cli-bin $LATEST_VERSION"
          else
            git commit -m "Update gitea-cli-bin to version $LATEST_VERSION"
          fi
          git pull --rebase origin main
          git push
